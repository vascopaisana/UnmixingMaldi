model_family: pure_cross_domain
default:
  seed: 7
  directions:
    - MARISMA_to_DRIAMS-A
    - DRIAMS-A_to_MARISMA
  models:
    svm:
      estimator: sklearn.svm.LinearSVC
      scaler: sklearn.preprocessing.MaxAbsScaler
      C: 1.0
      class_weight: balanced
      max_iter: 2500
      random_state: seed
    rf_multiclass:
      estimator: sklearn.ensemble.RandomForestClassifier
      n_estimators: 200
      class_weight: balanced_subsample
      n_jobs: inner_jobs
      random_state: seed
    knn:
      estimator: sklearn.neighbors.KNeighborsClassifier
      n_neighbors: 5
      weights: distance
      metric: cosine
      n_jobs: inner_jobs
    logistic_l1:
      estimator: sklearn.linear_model.LogisticRegression
      scaler: sklearn.preprocessing.MaxAbsScaler
      penalty: l1
      solver: liblinear
      C: 1.0
      class_weight: balanced
      multi_class: ovr
      max_iter: 1000
      n_jobs: 1
      random_state: seed
