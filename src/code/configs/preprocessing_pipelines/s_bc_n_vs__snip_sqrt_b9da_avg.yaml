# Full preprocessing used by the generated benchmark datasets.

pipeline:
  - Trimmer
  - Smoother
  - BaselineCorrecter
  - Normalizer
  - VarStabilizer
  - Binner

params:
  Trimmer:
    min: 2000
    max: 20000

  Smoother:
    halfwindow: 10
    polyorder: 3

  BaselineCorrecter:
    method: "SNIP"
    snip_n_iter: 20

  Normalizer:
    sum: 1

  VarStabilizer:
    method: "sqrt"

  Binner:
    start: 2000
    stop: 20000
    step: 9
    aggregation: "mean"
